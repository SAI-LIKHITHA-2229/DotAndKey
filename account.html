<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try{if(!localStorage.getItem("dk_current_user"))location.replace("login.html");}catch(e){}</script>
    <title>My Account - Dot & Key</title>
    <link rel="stylesheet" href="style.css?v=18">
</head>
<body class="account-page">

    <header class="navbar">
        <a href="index.html" class="logo"><img src="images/logo.png" alt="Dot &amp; Key"></a>
        <nav class="nav-links">
            <a href="index.html" class="nav-link" aria-label="Home">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/></svg>
                <span>Home</span>
            </a>
            <a href="shop.html" class="nav-link" aria-label="Shop">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l1 13H4z"/><path d="M8.5 7V5.5a3.5 3.5 0 0 1 7 0V7"/></svg>
                <span>Shop</span>
            </a>
            <a href="cart.html" class="nav-link" aria-label="Cart">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.3 11.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>
                <span>Cart</span>
            </a>
            <a href="account.html" class="nav-link" aria-label="Account">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/></svg>
                <span>Account</span>
            </a>
        </nav>
    </header>

    <section class="account-section">
        <div class="account-top">
            <h2>My Orders</h2>
            <div class="account-user">
                <span>Hi, <strong id="accountUser"></strong></span>
                <button type="button" id="logoutLink" class="logout-btn">Log out</button>
            </div>
        </div>
        <div id="ordersList"></div>
        <p id="ordersEmpty" class="orders-empty" hidden>
            You haven't placed any orders yet. <a href="shop.html">Start shopping &rarr;</a>
        </p>
    </section>

    <script src="script.js?v=18"></script>
</body>
</html>
